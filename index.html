<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SB COMENY • Secure Service Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* Aap apna pehla CSS yahan laga sakte hain (jo maine pehle diya tha) */
*{box-sizing:border-box}
body{
  margin:0;font-family:Poppins;min-height:100vh;
  background:linear-gradient(120deg,#5f2c82,#49a09d);color:#fff;padding:20px;
  display:flex;justify-content:center;align-items:flex-start
}
.profileCard {
  width:280px;background:rgba(255,255,255,.15);
  border-radius:20px;padding:25px;text-align:center;margin-right:40px
}
.profileCard img {
  width:120px;height:120px;border-radius:50%;
  border:4px solid #fff;object-fit:cover
}
.card {
  width:420px;background:rgba(255,255,255,.15);
  border-radius:20px;padding:30px;max-height:80vh;overflow-y:auto;
}
h2 {
  text-align:center;margin-bottom:20px
}
input, select, textarea {
  width:100%;padding:12px;margin:10px 0;border:none;border-radius:8px;
  font-family:Poppins
}
textarea {
  resize: vertical;
  min-height: 80px;
}
.btnMain {
  width:100%;padding:12px;border:none;border-radius:8px;background:#ff4b2b;color:#fff;font-weight:600;cursor:pointer;
  font-family:Poppins
}
.link {
  text-align:center;margin-top:10px;cursor:pointer;font-size:14px;
}
.hidden {display:none;}
.tableWrap {
  max-height:260px;overflow-y:auto;background:rgba(0,0,0,.25);
  border-radius:12px;padding:10px;margin-top:20px;
}
table {
  width:100%;border-collapse:collapse;color:#fff;font-size:13px;background:transparent
}
th, td {
  padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.25);
  text-align:left;vertical-align:top
}
th {font-weight:700;}
.toggleBtn {
  border:none;padding:6px 10px;border-radius:8px;color:#fff;
  font-weight:700;cursor:pointer;
}
.toggleBtn.active {
  background:#25D366;
}
.toggleBtn.inactive {
  background:#e91e63;
}
.small {
  margin-top:8px;opacity:.85;font-size:12px;
}
</style>
</head>

<body>

<!-- Owner Card -->
<div class="profileCard">
  <img src="https://raw.githubusercontent.com/bilal8766/SB-COMENY/main/bilal%20khan%20photos.jpeg" alt="Owner Image" />
  <h3>MOHD BILAL</h3>
  <p>Owner</p>
  <p>📞 9813490892</p>
</div>

<!-- Main Card with Login/Register/Dashboard -->
<div class="card">

  <div id="loginBox">
    <h2>Login</h2>
    <input id="lUser" placeholder="Email or Username" />
    <input id="lPass" type="password" placeholder="Password" />
    <button class="btnMain" onclick="login()">Login</button>
    <div class="link" onclick="showRegister()">Create Account</div>
  </div>

  <div id="registerBox" class="hidden">
    <h2>Register</h2>
    <input id="rName" placeholder="Full Name" />
    <input id="rUser" placeholder="Username" />
    <input id="rEmail" placeholder="Email" />
    <input id="rMobile" placeholder="Mobile Number (required)" type="tel" />
    <input id="rPass" type="password" placeholder="Password" />
    <button class="btnMain" onclick="register()">Register</button>
    <div class="link" onclick="showLogin()">Back to Login</div>
  </div>

  <div id="dashBox" class="hidden">
    <h2 id="welcomeText"></h2>

    <!-- CUSTOMER SERVICE SECTION -->
    <div id="customerServiceSection" style="display:none;">
      <label for="serviceSelect">Select Service:</label>
      <select id="serviceSelect">
        <option value="">-- Choose Service --</option>
        <option value="Service 1">Service 1</option>
        <option value="Service 2">Service 2</option>
        <option value="Service 3">Service 3</option>
      </select>
      <label for="customerDescription" style="margin-top:10px; display:block;">Description:</label>
      <textarea id="customerDescription" placeholder="Describe your request..."></textarea>
      <button class="btnMain" style="margin-top:10px;" onclick="submitCustomerRequest()">Send Request</button>
      <div id="requestStatus" class="small"></div>
    </div>

    <button id="liveLocationBtn" class="btnMain" style="margin-top:15px;display:none;" onclick="showLiveLocation()">Show Live Location</button>
    <div class="infoLine" id="liveLocationDisplay" style="margin-bottom:15px;"></div>

    <!-- Customer Info lines without sensitive details -->
    <div id="userInfoLine" class="infoLine"></div>
    <div id="pwdLine" class="infoLine"></div>
    <div id="regLocLine" class="infoLine"></div>
    <div id="curLocLine" class="infoLine"></div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="hidden">
      <h3>Registered Users (Latest First)</h3>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Username</th><th>Email</th><th>Mobile</th><th>Status</th><th>Registered Loc</th><th>Last Seen Loc</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
      <h3 style="margin-top:20px;">Customer Requests</h3>
      <div class="tableWrap" style="max-height:180px; overflow-y:auto;">
        <table>
          <thead>
            <tr><th>Customer Name</th><th>Mobile</th><th>Service</th><th>Description</th><th>Time</th></tr>
          </thead>
          <tbody id="customerRequestsTbody"></tbody>
        </table>
      </div>
    </div>

    <button class="btnMain" onclick="logout()" style="margin-top:20px;">Logout</button>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    runTransaction,
    collection,
    getDocs,
    query,
    orderBy,
    serverTimestamp,
    addDoc,
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4MgojTiFnORRy8R04V0PrTDCdhAtX4f0",
    authDomain: "sb-comeny-4b868.firebaseapp.com",
    databaseURL: "https://sb-comeny-4b868-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sb-comeny-4b868",
    storageBucket: "sb-comeny-4b868.firebasestorage.app",
    messagingSenderId: "738742516854",
    appId: "1:738742516854:web:42746572331fbac196b357",
    measurementId: "G-WGXV9ERTE3"
  };

  const ADMIN_UID = "AjsV5wAezsTIyzutmensvtqvHGR2";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginBox = document.getElementById("loginBox");
  const registerBox = document.getElementById("registerBox");
  const dashBox = document.getElementById("dashBox");
  const welcomeText = document.getElementById("welcomeText");
  const adminPanel = document.getElementById("adminPanel");
  const usersTbody = document.getElementById("usersTbody");
  const userInfoLine = document.getElementById("userInfoLine");
  const pwdLine = document.getElementById("pwdLine");
  const regLocLine = document.getElementById("regLocLine");
  const curLocLine = document.getElementById("curLocLine");
  const liveLocationBtn = document.getElementById("liveLocationBtn");
  const liveLocationDisplay = document.getElementById("liveLocationDisplay");

  const serviceSelect = document.getElementById("serviceSelect");
  const customerDescription = document.getElementById("customerDescription");
  const requestStatus = document.getElementById("requestStatus");
  const customerServiceSection = document.getElementById("customerServiceSection");
  const customerRequestsTbody = document.getElementById("customerRequestsTbody");

  function mapLink(lat,lng) {
    return `https://www.google.com/maps?q=${lat},${lng}`;
  }
  function fmtLoc(loc) {
    if(!loc || typeof loc.lat !== 'number') return '-';
    return `${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`;
  }
  function fmtLocLink(loc) {
    if(!loc || typeof loc.lat !== 'number') return '-';
    const url = mapLink(loc.lat, loc.lng);
    const text = fmtLoc(loc);
    return `<a href="${url}" target="_blank" style="color:#abd6ff;text-decoration:underline">${text}</a>`;
  }
  async function getGeo() {
    if(!"geolocation" in navigator) return null;
    return new Promise((resolve) => {
      navigator.geolocation.getCurrentPosition(
        (pos)=>resolve({lat:pos.coords.latitude,lng:pos.coords.longitude}),
        ()=>resolve(null),
        {enableHighAccuracy:true,timeout:10000,maximumAge:0});
    });
  }

  window.showLogin = () => {
    loginBox.classList.remove("hidden");
    registerBox.classList.add("hidden");
    dashBox.classList.add("hidden");
    adminPanel.classList.add("hidden");
    liveLocationDisplay.innerText="";
    customerServiceSection.style.display = "none";
  };
  window.showRegister = () => {
    loginBox.classList.add("hidden");
    registerBox.classList.remove("hidden");
    dashBox.classList.add("hidden");
    adminPanel.classList.add("hidden");
    liveLocationDisplay.innerText="";
  };

  window.logout = async () => {
    await signOut(auth);
    showLogin();
  };

  window.login = async () => {
    const input = lUser.value.trim();
    const pass = lPass.value.trim();
    if(!input || !pass) {
      alert("Please enter Email/Username and Password");
      return;
    }
    try {
      let emailToUse = input;
      if (!input.includes("@")) {
        const snap = await getDoc(doc(db,"usernames",input.toLowerCase()));
        if(!snap.exists()) {
          alert("Username not found");
          return;
        }
        emailToUse = snap.data().email;
      }
      await signInWithEmailAndPassword(auth,emailToUse,pass);
    } catch(e) {
      alert("Login failed: " + e.message);
    }
  };

  window.register = async () => {
    const name = rName.value.trim();
    const usernameRaw = rUser.value.trim();
    const email = rEmail.value.trim();
    const mobile = rMobile.value.trim();
    const pass = rPass.value.trim();
    if(!name || !usernameRaw || !email || !mobile || !pass) {
      alert("Please fill all fields");
      return;
    }
    if(!/^\d{10}$/.test(mobile)){
      alert("Mobile number must be 10 digits.");
      return;
    }
    const username = usernameRaw.toLowerCase();
    try {
      const regLocation = await getGeo();
      const cred = await createUserWithEmailAndPassword(auth,email,pass);
      await runTransaction(db, async(tx)=>{
        const usernameRef = doc(db,"usernames",username);
        const usernameSnap = await tx.get(usernameRef);
        if(usernameSnap.exists()) throw new Error("Username taken");
        tx.set(doc(db,"users",cred.user.uid),{
          name,
          username: usernameRaw,
          usernameLower: username,
          email,
          mobile,
          status:"active",
          regLocation: regLocation || null,
          lastLocation: regLocation || null,
          lastSeenAt: serverTimestamp(),
          createdAt: serverTimestamp()
        });
        tx.set(usernameRef,{
          uid: cred.user.uid,
          email,
          createdAt: serverTimestamp()
        });
      });
      alert("Registered successfully!");
      showLogin();
    } catch(e){
      alert("Registration error: "+ e.message);
    }
  };

  async function loadAllUsersForAdmin() {
    usersTbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Loading...</td></tr>`;
    const q = query(collection(db,"users"),orderBy("createdAt","desc"));
    const snap = await getDocs(q);
    if(snap.empty){
      usersTbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">No users found.</td></tr>`;
      return;
    }
    usersTbody.innerHTML="";
    snap.forEach((docSnap)=>{
      const u=docSnap.data();
      const status = u.status || "active";
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${u.name||"-"}</td>
        <td>${u.username||"-"}</td>
        <td>${u.email||"-"}</td>
        <td>${u.mobile||"-"}</td>
        <td data-col="status">${status}</td>
        <td>${fmtLocLink(u.regLocation)}</td>
        <td>${fmtLocLink(u.lastLocation)}</td>
        <td>
          <button class="toggleBtn ${status==="inactive"?"inactive":"active"}" data-uid="${docSnap.id}" data-status="${status}">
            ${status==="active"?"Deactivate":"Activate"}
          </button>
        </td>
      `;
      usersTbody.appendChild(tr);
    });
  }

  usersTbody.addEventListener("click",async(e)=>{
    const btn=e.target.closest(".toggleBtn");
    if(!btn)return;
    const uid=btn.dataset.uid;
    const current=btn.dataset.status;
    const next=current==="active"?"inactive":"active";
    try{
      await updateDoc(doc(db,"users",uid),{status:next});
      btn.dataset.status=next;
      btn.textContent=next==="active"?"Deactivate":"Activate";
      btn.classList.toggle("inactive",next==="inactive");
      btn.classList.toggle("active",next==="active");
      btn.closest("tr").querySelector('td[data-col="status"]').textContent=next;
    }catch(err){
      alert("Failed: "+err.message);
    }
  });

  async function loadCustomerRequests(){
    customerRequestsTbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#fff;">Loading...</td></tr>`;
    const q=query(collection(db,"customerRequests"),orderBy("createdAt","desc"));
    const snap=await getDocs(q);
    if(snap.empty){
      customerRequestsTbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#fff;">No requests found.</td></tr>`;
      return;
    }
    customerRequestsTbody.innerHTML="";
    snap.forEach(docSnap=>{
      const req=docSnap.data();
      const date=req.createdAt?.toDate?req.createdAt.toDate().toLocaleString():"-";
      const tr=document.createElement("tr");
      tr.innerHTML=`
      <td>${req.name||'-'}</td>
      <td>${req.mobile||'-'}</td>
      <td>${req.service||'-'}</td>
      <td>${req.description||'-'}</td>
      <td>${date}</td>
      `;
      customerRequestsTbody.appendChild(tr);
    });
  }

  async function submitCustomerRequest(){
    const service = serviceSelect.value;
    const description = customerDescription.value.trim();
    const user = auth.currentUser;
    if (!user) { alert("Please login."); return; }
    if (!service) { alert("Select service."); return; }
    if (!description) { alert("Enter description."); return; }
    const uDoc = await getDoc(doc(db,"users",user.uid));
    if (!uDoc.exists()) { alert("User profile missing."); return; }
    const uData = uDoc.data();
    try {
      await addDoc(collection(db,"customerRequests"),{
        uid: user.uid,
        name: uData.name,
        mobile: uData.mobile,
        service,
        description,
        createdAt: serverTimestamp()
      });
      requestStatus.style.color = "#a2f5a2";
      requestStatus.innerText = "Request submitted.";
      serviceSelect.value = "";
      customerDescription.value = "";
    } catch(e){
      requestStatus.style.color = "#ffbaba";
      requestStatus.innerText = "Submit failed: "+e.message;
    }
  }
  window.submitCustomerRequest = submitCustomerRequest;

  onAuthStateChanged(auth, async user=>{
    if(!user){showLogin();return;}
    if(user.uid===ADMIN_UID){
      loginBox.classList.add("hidden");
      registerBox.classList.add("hidden");
      dashBox.classList.remove("hidden");
      welcomeText.innerText="Admin Dashboard";
      adminPanel.classList.remove("hidden");
      userInfoLine.innerText="";
      pwdLine.innerText="";
      regLocLine.innerText="";
      curLocLine.innerText="";
      await loadAllUsersForAdmin();
      await loadCustomerRequests();
      liveLocationBtn.style.display = "none";
      customerServiceSection.style.display = "none";
      return;
    }
    const uRef=doc(db,"users",user.uid);
    const uSnap=await getDoc(uRef);
    loginBox.classList.add("hidden");
    registerBox.classList.add("hidden");
    dashBox.classList.remove("hidden");
    adminPanel.classList.add("hidden");
    liveLocationBtn.style.display = "inline-block";
    customerServiceSection.style.display = "block";
    if(!uSnap.exists()){
      welcomeText.innerText = "Welcome "+(user.email||user.phoneNumber||"");
      userInfoLine.innerText = "";
      pwdLine.innerText = "";
      regLocLine.innerText = "";
      curLocLine.innerText = "";
      return;
    }
    const u = uSnap.data();
    if(u.status==="inactive"){
      alert("Your account is deactivated. Contact admin.");
      await signOut(auth);
      showLogin();
      return;
    }
    welcomeText.innerText = `Welcome ${u.name||"-"}`;
    userInfoLine.innerText = `Name: ${u.name||"-"} | Mobile: ${u.mobile||"-"}`;
    pwdLine.innerText = "";
    regLocLine.innerText = "";
    curLocLine.innerText = "";
  });

  window.showLiveLocation = () => {
    liveLocationDisplay.innerText = "Getting current location...";
    if (!navigator.geolocation) {
      liveLocationDisplay.innerText = "Geolocation not supported.";
      return;
    }
    navigator.geolocation.getCurrentPosition(pos=>{
      const lat=pos.coords.latitude.toFixed(5);
      const lng=pos.coords.longitude.toFixed(5);
      liveLocationDisplay.innerHTML = `Your current location: <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" style="color:#abd6ff;text-decoration:underline">${lat}, ${lng}</a>`;
    }, ()=>{
      liveLocationDisplay.innerText = "Unable to get location.";
    }, {enableHighAccuracy: true,timeout:10000});
  };

  window.logout = async ()=>{
    await signOut(auth);
    showLogin();
  };

  // Show and Hide helper for login/register
  window.showLogin = ()=>{
    loginBox.classList.remove("hidden");
    registerBox.classList.add("hidden");
    dashBox.classList.add("hidden");
    adminPanel.classList.add("hidden");
    liveLocationDisplay.innerText = "";
    customerServiceSection.style.display = "none";
    requestStatus.innerText = "";
  };

  window.showRegister = ()=>{
    loginBox.classList.add("hidden");
    registerBox.classList.remove("hidden");
    dashBox.classList.add("hidden");
    adminPanel.classList.add("hidden");
    liveLocationDisplay.innerText = "";
    customerServiceSection.style.display = "none";
    requestStatus.innerText = "";
  };
</script>

</body>
</html>
